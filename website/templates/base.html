<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SPX VRP Strategy{% endblock %} — FinTech 533</title>

  <!-- Bootstrap 5 dark -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>

  <!-- Project styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">

  {% block head_extra %}{% endblock %}
</head>
<body>

<!-- ── Navigation ─────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-md sticky-top" id="main-nav">
  <div class="container-xxl">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('home') }}">
      <span class="brand-icon">▲</span>
      <span class="brand-text">SPX VRP</span>
    </a>

    <button class="navbar-toggler border-0" type="button"
            data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item">
          <a class="nav-link {% if active == 'home' %}active{% endif %}"
             href="{{ url_for('home') }}">Strategy</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'results' %}active{% endif %}"
             href="{{ url_for('results') }}">Results</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'tests' %}active{% endif %}"
             href="{{ url_for('tests_view') }}">Tests</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ── Page content ───────────────────────────────────────────────────────── -->
<main class="container-xxl py-4">
  {% block content %}{% endblock %}
</main>

<!-- ── Footer ─────────────────────────────────────────────────────────────── -->
<footer class="site-footer">
  <div class="container-xxl">
    <span class="footer-course">FinTech 533 — Duke MEng Financial Technology</span>
    <span class="footer-sep">·</span>
    <span class="footer-names">Robert Lanni &amp; Mario Trevino</span>
    <span class="footer-sep">·</span>
    <span class="footer-note">XSP Put Credit Spreads / VRP Harvesting</span>
  </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmkcP+M8vH5o7UQZSu4fN+pjEF5" crossorigin="anonymous"></script>

<!-- Project charts -->
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>

{% block scripts %}{% endblock %}
</body>
</html>
